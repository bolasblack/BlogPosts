name: Generate Feed

on:
  push:
    branches:
      - posts

jobs:
  generate-feed:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout posts branch
        uses: actions/checkout@v4
        with:
          ref: posts
          fetch-depth: 0

      - name: Setup mise
        uses: jdx/mise-action@v2

      - name: Install tools
        working-directory: _meta
        run: mise install

      - name: Generate feed.xml
        working-directory: _meta
        run: mise exec -- bb generate_feed.clj

      - name: Check for changes
        id: check-changes
        run: |
          if git diff --quiet _meta/feed.xml; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push to master
        if: steps.check-changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Update feed.xml from posts branch"
          git push origin HEAD:master --force
